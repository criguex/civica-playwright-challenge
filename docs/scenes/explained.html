const C = {navy: '#071B2B', deep: '#0D2638', panel: '#123448', grid: '#214456', mint: '#55DFBD', gold: '#FFC56E', coral: '#FB8176', white: '#F4F7F5', muted: '#ABC0C8', muted2: '#8FA6B0'};

const clamp = x => Math.max(0, Math.min(1, x));

    return `<circle r="${r}" fill="${c}"/>${sym}${p.text ? tx(0, r + 28, p.text, {size: 18, w: 700}) : ''}`;

    return `<rect x="-32" y="-80" width="64" height="160" rx="18" fill="${C.deep}" stroke="${C.grid}" stroke-width="3"/>${lamp(-46, C.coral, 'coral')}${lamp(0, C.gold, 'gold')}${lamp(46, C.mint, 'mint')}

  },

  doc: p => {

  },
  pill: p => {
    const w = p.w || 180, c = K[p.k] || C.grid;
    const sym = p.k === 'ok' ? '✓' : p.k === 'no' ? '✗' : p.k === 'warn' ? '!' : '';
    return `<rect x="${-w / 2}" y="-20" width="${w}" height="40" rx="20" fill="${C.deep}" stroke="${c}" stroke-width="3"/>

  },
  server: p => `<rect x="-50" y="-66" width="100" height="40" rx="8" fill="${C.panel}" stroke="${C.grid}" stroke-width="3"/><rect x="-50" y="-20" width="100" height="40" rx="8" fill="${C.panel}" stroke="${C.grid}" stroke-width="3"/><rect x="-50" y="26" width="100" height="40" rx="8" fill="${C.panel}" stroke="${C.grid}" stroke-width="3"/>

    <path d="M-12 -44 L14 -29 L-12 -14 Z" fill="${C.muted}"/>${tx(0, 34, p.title, {size: 15, w: 700})}${tx(0, 58, p.sub, {size: 13, c: C.gold, f: MONO})}`,

  arrow: p => {
    const k = clamp((t - p._abs) / 0.4), x2 = p.dx * k, y2 = p.dy * k, c = K[p.k] || C.mint;
    const a = Math.atan2(p.dy, p.dx), hs = 12;
    const head = k > .2 ? `<path d="M${x2} ${y2} L${x2 - hs * Math.cos(a - .5)} ${y2 - hs * Math.sin(a - .5)} L${x2 - hs * Math.cos(a + .5)} ${y2 - hs * Math.sin(a + .5)} Z" fill="${c}"/>` : '';
    return `<line x1="0" y1="0" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="5" stroke-linecap="round" ${p.dash ? 'stroke-dasharray="10 9"' : ''}/>${head}`;

const beats = S.beats;
let bi = beats.findIndex(b => t >= b.t0 && t < b.t1);
if (bi < 0) bi = beats.length - 1;
const B = beats[bi];
const lt = t - B.t0;
const bf = Math.min(clamp(lt / 0.3), clamp((B.t1 - t) / 0.3));
let g = '';
(B.items || []).forEach(it => {
  const at = it.at || 0;
  if (lt < at) return;
  const k = clamp((lt - at) / 0.35);
  let x = it.x, y = it.y;
  if (it.to) {
    const mk = ease(clamp((lt - (it.to[2] || at + .4)) / (it.to[3] || .8)));
    x += (it.to[0] - it.x) * mk; y += (it.to[1] - it.y) * mk;
  }
  const sc = (it.s || 1) * (it.arrow || it.sp === 'arrow' ? 1 : back(k));
  it._abs = B.t0 + at;
  const op = (it.sp === 'arrow' ? 1 : clamp(k * 2)) * (it.out ? clamp((it.out + 0.3 - lt) / 0.3) : 1);
  g += `<g transform="translate(${x} ${y}) scale(${sc})" opacity="${op * (it.o || 1)}">${SP[it.sp](it)}</g>`;
});
let dots = '';
beats.forEach((b, i) => { dots += `<circle cx="${480 - (beats.length - 1) * 13 + i * 26}" cy="510" r="${i === bi ? 7 : 5}" fill="${i <= bi ? C.mint : C.grid}"/>`; });
const head = lang === 'es' ? 'EXPLICADO PARA UN NIÑO DE 8 AÑOS' : "EXPLAINED LIKE YOU'RE 8";

<rect width="960" height="540" fill="${C.navy}"/><rect width="960" height="540" fill="url(#g)"/><rect width="8" height="540" fill="${C.mint}"/>
<g opacity="${clamp(Math.min(t / .3, (S.duration - t) / .4))}">
<text x="36" y="34" font-family="${MONO}" font-size="12" letter-spacing="2.5" fill="${C.muted2}">${esc(S.repo)} · ${head}</text>
<text x="924" y="34" font-family="${MONO}" font-size="12" fill="${C.muted2}" text-anchor="end">${bi + 1}/${beats.length}</text>

<text x="480" y="86" font-family="${HEAD}" font-size="30" fill="${C.white}" text-anchor="middle">${esc(B.cap)}</text>
${g}
</g>

</g>`;
