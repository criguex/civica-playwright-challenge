name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Lint + Typecheck + full offline test catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run ledger unit tests
        run: npm run test:unit

      - name: Restore mutation ledgers from the latest main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --status completed --limit 5 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name mutation-insights --dir ledger; then
              echo "Restored ledgers from run $run_id"; ls -l ledger; exit 0
            fi
          done
          echo "No previous ledger artifact found; starting a fresh ledger"

      - name: Run mock suite (includes accessibility)
        run: npm run test:mock

      - name: Run mutation suite
        run: npm run test:mutation

      - name: Run audit POCs suite
        run: npm run test:audit

      - name: Upload audit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: test-results/audit/
          retention-days: 14
          if-no-files-found: ignore

      - name: Run API suite
        run: npm run test:api

      - name: Run contract suite
        run: npm run test:contract

      - name: Run performance budget suite
        run: npm run test:performance

      - name: Run visual regression suite
        run: npm run test:visual

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload mutation insights ledgers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-insights
          path: ledger/
          retention-days: 90
          if-no-files-found: ignore
